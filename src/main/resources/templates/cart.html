<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"
        integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="cartStyles.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <script src="https://kit.fontawesome.com/580f8cec38.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <title>Document</title>
</head>
<body>
    <div class="header" id="header"></div>
    <div class="center" id="center">
        <div class="container">
            <div class="wrapper_cart">
                <div class="content_left">
                    <div class="header_cart">
                        <div class="title_cart">
                            <span>Your cart</span>
                        </div>
                        <div class="add_more">
                            <a href="#">Add more</a>
                        </div>
                    </div>
                    <div class="cart_list">
                        <div class="cart_item">
                            <div class="info_cart">
                                <div class="img">
                                    <img src="/img/cart1.jpg" alt="">
                                </div>
                                <div class="info">
                                    <p class="name">Cheese Stick </p>
                                    <p class="price">36.000 ₫</p>
                                </div>
                            </div>
                            <div class="quantity_cart">
                                <div class="btn_count">
                                    <button type="button" class="btn_minus">-</button>
                                    <input class="txt_count" maxlength="2" value="1">
                                    <button type="button" class="btn_plus">+</button>
                                </div>
                                <div class="btn_delete">
                                    <button type="button" class="btn_delete_cart"><img src="/img/icon-delete.svg" alt=""></button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="content_right">
                    
                </div>
            </div>
        </div>
    </div>
    <div class="footer" id="footer"></div>
    <script src="/scripts.js"></script>
</body>
</html>
