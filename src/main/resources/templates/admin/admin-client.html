<!DOCTYPE html>
<html class="light" lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Quản Lý Người Dùng - FoodAdmin</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="/css/admin/adminStyles.css" th:href="@{/css/admin/adminStyles.css}" />
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#19c3e6",
                        "background-light": "#f6f8f8",
                        "background-dark": "#111e21",
                        "card-light": "#ffffff",
                        "card-dark": "#1a2a2e",
                        "text-light-primary": "#111718",
                        "text-dark-primary": "#ffffff",
                        "text-light-secondary": "#638288",
                        "text-dark-secondary": "#a0b1b4",
                        "border-light": "#dce4e5",
                        "border-dark": "#334144",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
</head>

<body
    class="admin-shell font-display bg-background-light dark:bg-background-dark text-text-light-primary dark:text-text-dark-primary">
    <div class="flex min-h-screen">
        <aside th:insert="~{admin/fragments/sidebar :: sidebar('users')}"></aside>
        <main class="flex-1 flex flex-col">
            <header
                class="flex items-center justify-between whitespace-nowrap border-b border-border-light dark:border-border-dark px-10 py-3 bg-card-light dark:bg-card-dark sticky top-0 z-10">
                <div class="flex items-center gap-4">
                    <h2
                        class="text-text-light-primary dark:text-text-dark-primary text-lg font-bold leading-tight tracking-[-0.015em]">
                        Quản Lý Người Dùng</h2>
                </div>
                <div class="flex items-center gap-4">
                    <button
                        class="flex items-center justify-center rounded-lg h-10 w-10 bg-background-light dark:bg-background-dark text-text-light-secondary dark:text-text-dark-secondary hover:text-primary transition-colors">
                        <span class="material-symbols-outlined">notifications</span>
                    </button>
                    <img
                        src="https://res.cloudinary.com/dhpe3eg2o/image/upload/v1763273370/logo_qyyx8x.png"
                        alt="Admin User Avatar" class="admin-avatar aspect-square rounded-full size-10 object-cover" />
                </div>
            </header>
            <div class="flex-1 p-6 lg:p-10 overflow-y-auto">
                <div class="max-w-7xl mx-auto">
                    <div
                        class="bg-card-light dark:bg-card-dark p-6 md:p-8 rounded-xl border border-border-light dark:border-border-dark">
                        <div class="flex flex-col md:flex-row items-center justify-between gap-4 mb-6">
                            <div class="flex items-center gap-4 w-full md:w-auto">
                                <div class="relative w-full md:w-64">
                                    <span
                                        class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-text-light-secondary dark:text-text-dark-secondary">search</span>
                                    <input
                                        class="form-input w-full rounded-lg border-border-light dark:border-border-dark bg-background-light dark:bg-background-dark focus:ring-2 focus:ring-primary text-sm pl-10"
                                        placeholder="Tìm theo tên, email..." type="text" />
                                </div>
                                <select
                                    class="form-select w-full md:w-48 rounded-lg border-border-light dark:border-border-dark bg-background-light dark:bg-background-dark focus:ring-2 focus:ring-primary text-sm">
                                    <option>Tất cả vai trò</option>
                                    <option>Quản trị viên</option>
                                    <option>Khách hàng</option>
                                </select>
                            </div>
                            <button
                                class="w-full md:w-auto flex-shrink-0 flex items-center justify-center gap-2 px-4 py-2 text-sm font-medium rounded-lg bg-primary text-white hover:bg-primary/90 transition-colors">
                                <span class="material-symbols-outlined">add</span>
                                <span>Thêm người dùng</span>
                            </button>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-sm text-left">
                                <thead
                                    class="text-xs text-text-light-secondary dark:text-text-dark-secondary uppercase bg-background-light dark:bg-background-dark">
                                    <tr>
                                        <th class="px-6 py-3" scope="col">ID</th>
                                        <th class="px-6 py-3" scope="col">Tên người dùng</th>
                                        <th class="px-6 py-3" scope="col">Email</th>
                                        <th class="px-6 py-3" scope="col">Số điện thoại</th>
                                        <th class="px-6 py-3" scope="col">Vai trò</th>
                                        <th class="px-6 py-3 text-right" scope="col">Thao tác</th>
                                    </tr>
                                </thead>
                                <tbody th:if="${accounts == null || #lists.isEmpty(accounts)}">
                                    <tr class="bg-card-light dark:bg-card-dark border-b border-border-light dark:border-border-dark">
                                        <td class="px-6 py-6 text-center text-text-light-secondary dark:text-text-dark-secondary" colspan="6">
                                            Chưa có người dùng nào trong hệ thống.
                                        </td>
                                    </tr>
                                </tbody>
                                <tbody th:if="${accounts != null && !#lists.isEmpty(accounts)}">
                                    <tr th:each="account : ${accounts}"
                                        class="bg-card-light dark:bg-card-dark border-b border-border-light dark:border-border-dark">
                                        <td class="px-6 py-4 font-medium" th:text="|#${account.id}|">#0</td>
                                        <td class="px-6 py-4">
                                            <div class="flex items-center gap-3">
                                                <div
                                                    class="admin-avatar size-8 aspect-square rounded-full bg-background-light dark:bg-background-dark flex items-center justify-center font-semibold text-sm uppercase">
                                                    <span th:text="${#strings.substring((account.fullName != null && !#strings.isEmpty(account.fullName) ? account.fullName : account.phone), 0, 1)}">A</span>
                                                </div>
                                                <div class="flex flex-col">
                                                    <span class="font-medium"
                                                        th:text="${account.fullName != null && !#strings.isEmpty(account.fullName) ? account.fullName : 'Chưa cập nhật'}">Tên người dùng</span>
                                                    <span class="text-xs text-text-light-secondary dark:text-text-dark-secondary" th:text="${account.createdAt != null ? #temporals.format(account.createdAt, 'dd/MM/yyyy HH:mm') : ''}"></span>
                                                </div>
                                            </div>
                                        </td>
                                        <td class="px-6 py-4 text-text-light-secondary dark:text-text-dark-secondary"
                                            th:text="${account.email != null && !#strings.isEmpty(account.email) ? account.email : 'Chưa cung cấp'}">email</td>
                                        <td class="px-6 py-4 text-text-light-secondary dark:text-text-dark-secondary"
                                            th:text="${account.phone}">phone</td>
                                        <td class="px-6 py-4">
                                            <span class="px-2 py-1 text-xs font-medium rounded-full"
                                                th:text="${account.hasRole('ADMIN') ? 'Quản trị viên' : 'Khách hàng'}"
                                                th:classappend="${account.hasRole('ADMIN')} ? ' bg-blue-100 dark:bg-blue-900/50 text-blue-800 dark:text-blue-300' : ' bg-green-100 dark:bg-green-900/50 text-green-800 dark:text-green-300'">
                                            </span>
                                        </td>
                                        <td class="px-6 py-4 text-right">
                                            <div class="flex justify-end items-center gap-2 text-text-light-secondary dark:text-text-dark-secondary">
                                                <span class="inline-flex items-center gap-1 text-sm"
                                                    th:text="${account.status != null && account.status == 1 ? 'Hoạt động' : 'Bị khóa'}"></span>
                                                <div class="relative" data-user-actions>
                                                    <button type="button"
                                                        class="p-1.5 rounded-md hover:bg-background-light dark:hover:bg-background-dark"
                                                        data-user-actions-toggle>
                                                        <span class="material-symbols-outlined text-base">more_vert</span>
                                                    </button>
                                                    <div
                                                        class="hidden absolute right-0 mt-2 w-40 rounded-lg border border-border-light dark:border-border-dark bg-card-light dark:bg-card-dark shadow-lg z-10"
                                                        data-user-actions-menu>
                                                        <button type="button"
                                                            class="w-full flex items-center gap-2 px-4 py-2 text-sm hover:bg-background-light dark:hover:bg-background-dark text-left"
                                                            th:attr="data-edit-url=@{|/admin/users/${account.id}|}"
                                                            data-user-edit>
                                                            <span class="material-symbols-outlined text-base">edit</span>
                                                            <span>Chỉnh sửa</span>
                                                        </button>
                                                        <button type="button"
                                                            class="w-full flex items-center gap-2 px-4 py-2 text-sm text-red-600 hover:bg-red-50 dark:hover:bg-red-900/20 text-left"
                                                            th:attr="data-account-id=${account.id}, data-account-name=${account.fullName != null && !#strings.isEmpty(account.fullName) ? account.fullName : account.phone}"
                                                            data-user-delete>
                                                            <span class="material-symbols-outlined text-base">delete</span>
                                                            <span>Xoá</span>
                                                        </button>
                                                    </div>
                                                    <form method="post" th:action="@{/admin/users/delete}"
                                                        class="hidden" data-user-delete-form>
                                                        <input type="hidden" name="id" th:value="${account.id}" />
                                                        <input th:if="${_csrf != null}" type="hidden"
                                                            th:name="${_csrf.parameterName}"
                                                            th:value="${_csrf.token}" />
                                                    </form>
                                                </div>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <div class="flex items-center justify-between pt-4">
                            <span class="text-sm text-text-light-secondary dark:text-text-dark-secondary">
                                Hiển thị <span class="font-semibold text-text-light-primary dark:text-text-dark-primary"
                                    th:text="${accounts != null ? accounts.size() : 0}">0</span>
                                trên <span class="font-semibold text-text-light-primary dark:text-text-dark-primary"
                                    th:text="${totalUsers != null ? totalUsers : 0}">0</span>
                            </span>
                            <div class="inline-flex items-center -space-x-px text-sm">
                                <button
                                    class="flex items-center justify-center px-3 h-8 ms-0 leading-tight text-text-light-secondary bg-card-light border border-border-light rounded-l-lg dark:bg-card-dark dark:border-border-dark dark:text-text-dark-secondary"
                                    disabled>Trước</button>
                                <button
                                    class="flex items-center justify-center px-3 h-8 leading-tight text-text-light-secondary bg-card-light border border-border-light rounded-r-lg dark:bg-card-dark dark:border-border-dark dark:text-text-dark-secondary"
                                    disabled>Sau</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const wrappers = document.querySelectorAll('[data-user-actions]');
            let openedMenu = null;

            const closeMenu = () => {
                if (openedMenu) {
                    openedMenu.classList.add('hidden');
                    openedMenu = null;
                }
            };

            wrappers.forEach((wrapper) => {
                const toggleBtn = wrapper.querySelector('[data-user-actions-toggle]');
                const menu = wrapper.querySelector('[data-user-actions-menu]');
                const deleteBtn = wrapper.querySelector('[data-user-delete]');
                const editBtn = wrapper.querySelector('[data-user-edit]');

                if (toggleBtn && menu) {
                    toggleBtn.addEventListener('click', (event) => {
                        event.preventDefault();
                        event.stopPropagation();
                        if (openedMenu && openedMenu !== menu) {
                            closeMenu();
                        }
                        if (menu.classList.contains('hidden')) {
                            menu.classList.remove('hidden');
                            openedMenu = menu;
                        } else {
                            closeMenu();
                        }
                    });
                }

                if (deleteBtn) {
                    deleteBtn.addEventListener('click', (event) => {
                        event.preventDefault();
                        const targetName = deleteBtn.dataset.accountName || 'người dùng';
                        const confirmation = confirm(`Bạn có chắc muốn xoá ${targetName}?`);
                        if (!confirmation) {
                            closeMenu();
                            return;
                        }
                        const form = wrapper.querySelector('[data-user-delete-form]');
                        if (form) {
                            form.submit();
                        }
                    });
                }

                if (editBtn) {
                    editBtn.addEventListener('click', (event) => {
                        event.preventDefault();
                        const url = editBtn.dataset.editUrl;
                        if (url) {
                            window.location.href = url;
                        }
                    });
                }
            });

            document.addEventListener('click', (event) => {
                if (openedMenu && !openedMenu.contains(event.target)) {
                    closeMenu();
                }
            });

            document.addEventListener('keydown', (event) => {
                if (event.key === 'Escape') {
                    closeMenu();
                }
            });
        });
    </script>
</body>

</html>
