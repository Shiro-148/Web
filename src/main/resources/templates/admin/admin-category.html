<!DOCTYPE html>
<html class="light" lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Quản lý Danh mục - FoodAdmin</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="/css/admin/adminStyles.css" th:href="@{/css/admin/adminStyles.css}" />
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#19c3e6",
                        "background-light": "#f6f8f8",
                        "background-dark": "#111e21",
                        "card-light": "#ffffff",
                        "card-dark": "#1a2a2e",
                        "text-light-primary": "#111718",
                        "text-dark-primary": "#ffffff",
                        "text-light-secondary": "#638288",
                        "text-dark-secondary": "#a0b1b4",
                        "border-light": "#dce4e5",
                        "border-dark": "#334144",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
</head>

<body
    class="admin-shell font-display bg-background-light dark:bg-background-dark text-text-light-primary dark:text-text-dark-primary">
    <div class="flex min-h-screen">
        <aside th:insert="~{admin/fragments/sidebar :: sidebar('categories')}"></aside>
        <main class="flex-1 flex flex-col">
            <header
                class="flex items-center justify-between whitespace-nowrap border-b border-border-light dark:border-border-dark px-10 py-3 bg-card-light dark:bg-card-dark sticky top-0 z-10">
                <h2
                    class="text-text-light-primary dark:text-text-dark-primary text-lg font-bold leading-tight tracking-[-0.015em]">
                    Quản lý Danh mục</h2>
                <div class="flex items-center gap-4">
                    <button
                        class="flex items-center justify-center rounded-lg h-10 w-10 bg-background-light dark:bg-background-dark text-text-light-secondary dark:text-text-dark-secondary hover:text-primary transition-colors">
                        <span class="material-symbols-outlined">notifications</span>
                    </button>
                    <img src="https://res.cloudinary.com/dhpe3eg2o/image/upload/v1763273370/logo_qyyx8x.png"
                        alt="Admin User Avatar" class="admin-avatar aspect-square rounded-full size-10 object-cover" />
                </div>
            </header>
            <div class="flex-1 p-6 lg:p-10 overflow-y-auto">
                <div class="grid grid-cols-1 md:grid-cols-3 xl:grid-cols-4 gap-6 items-start">
                    <div class="md:col-span-1 xl:col-span-1 flex flex-col gap-4">
                        <div class="flex items-center justify-between">
                            <h3 class="text-base font-semibold">Danh mục</h3>
                        </div>
                        <div
                            class="bg-card-light dark:bg-card-dark rounded-xl border border-border-light dark:border-border-dark p-2 flex flex-col gap-2 w-admin-list-category">
                            <p class="text-sm text-text-light-secondary dark:text-text-dark-secondary px-2"
                                th:if="${categories == null || #lists.isEmpty(categories)}">
                                Chưa có danh mục nào.
                            </p>
                            <div th:each="category : ${categories}"
                                class="flex items-center justify-between gap-2 p-2 rounded-lg hover:bg-background-light dark:hover:bg-background-dark transition-colors"
                                th:attr="data-category-item=${category.idCategory},data-category-img=${category.imgPath}"
                                th:classappend="${selectedCategory != null and selectedCategory.idCategory == category.idCategory} ? ' bg-primary/10 ring-1 ring-primary/40' : ''">
                                <a class="flex items-center gap-3 flex-1 min-w-0"
                                   th:href="@{/admin/categories(categoryId=${category.idCategory})}">
                                    <img th:if="${category.imgPath != null}"
                                         th:src="${category.imgPath}"
                                         alt="Ảnh danh mục"
                                         class="w-9 h-9 rounded-lg object-cover flex-shrink-0" />
                                    <div class="flex items-center justify-between gap-2 flex-1 min-w-0">
                                        <span class="font-medium text-sm truncate" data-category-name
                                              th:text="${category.nameCategory}">Danh mục</span>
                                        <span
                                            class="text-xs text-text-light-secondary dark:text-text-dark-secondary bg-background-light dark:bg-background-dark py-1 px-2 rounded-full flex-shrink-0"
                                            th:text="${category.products != null ? category.products.size() : 0}">0</span>
                                    </div>
                                </a>
                                <div class="flex items-center gap-1 flex-shrink-0">
                                    <button type="button"
                                            class="p-1.5 rounded hover:bg-background-light dark:hover:bg-background-dark text-text-light-secondary dark:text-text-dark-secondary"
                                            th:onclick="|openEditCategoryModal(${category.idCategory})|">
                                        <span class="material-symbols-outlined text-sm">edit</span>
                                    </button>
                                    <button type="button"
                                            class="p-1.5 rounded hover:bg-background-light dark:hover:bg-background-dark text-red-500"
                                            th:onclick="|confirmDeleteCategory(${category.idCategory})|">
                                        <span class="material-symbols-outlined text-sm">delete</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="md:col-span-2 xl:col-span-3 flex flex-col gap-4">
                        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                            <div class="flex-1">
                                <h3 class="text-base font-semibold" th:if="${selectedCategory != null}"
                                    th:text="|Sản phẩm trong '${selectedCategory.nameCategory}'|">
                                    Sản phẩm
                                </h3>
                                <h3 class="text-base font-semibold" th:unless="${selectedCategory != null}">
                                    Chưa có danh mục được chọn
                                </h3>
                                <p class="text-sm text-text-light-secondary dark:text-text-dark-secondary"
                                    th:text="${selectedCategory != null ? selectedCategoryProducts.size() + ' sản phẩm' : '0 sản phẩm'}">
                                    0 sản phẩm
                                </p>
                            </div>
                            <div class="flex flex-col sm:flex-row gap-2 w-full sm:w-auto flex-shrink-0">
                                <button type="button" onclick="openCreateCategoryModal()"
                                    class="flex items-center justify-center gap-2 px-4 py-2 text-sm font-medium rounded-lg bg-primary/20 text-primary hover:bg-primary/30 transition-colors">
                                    <span class="material-symbols-outlined">add</span>
                                    <span>Thêm Danh Mục Mới</span>
                                </button>
                                <button
                                    class="flex items-center justify-center gap-2 px-4 py-2 text-sm font-medium rounded-lg bg-primary text-white hover:bg-primary/90 transition-colors">
                                    <span class="material-symbols-outlined">add</span>
                                    <span>Thêm Sản Phẩm</span>
                                </button>
                            </div>
                        </div>
                        <div
                            class="bg-card-light dark:bg-card-dark rounded-xl border border-border-light dark:border-border-dark overflow-hidden">
                            <div class="overflow-x-auto">
                                <table class="w-full text-sm text-left">
                                    <thead
                                        class="bg-background-light dark:bg-background-dark text-xs text-text-light-secondary dark:text-text-dark-secondary uppercase">
                                        <tr>
                                            <th class="px-3 py-3 font-medium" scope="col">Tên Sản Phẩm</th>
                                            <th class="px-3 py-3 font-medium" scope="col">Giá Bán</th>
                                            <th class="px-3 py-3 font-medium" scope="col">Trạng Thái</th>
                                            <th class="px-3 py-3 font-medium text-center" scope="col">Thao Tác</th>
                                        </tr>
                                    </thead>
                                    <tbody
                                        th:if="${selectedCategoryProducts == null || #lists.isEmpty(selectedCategoryProducts)}">
                                        <tr>
                                            <td class="px-3 py-6 text-center text-text-light-secondary dark:text-text-dark-secondary"
                                                colspan="5">
                                                Chưa có sản phẩm nào thuộc danh mục này.
                                            </td>
                                        </tr>
                                    </tbody>
                                    <tbody
                                        th:if="${selectedCategoryProducts != null && !#lists.isEmpty(selectedCategoryProducts)}">
                                        <tr th:each="product : ${selectedCategoryProducts}"
                                            class="border-b border-border-light dark:border-border-dark hover:bg-background-light dark:hover:bg-background-dark">
                                            <td
                                                class="px-3 py-2 font-semibold text-text-light-primary dark:text-text-dark-primary">
                                                <div class="flex items-center gap-3">
                                                    <img th:if="${product.imgPathProduct != null}"
                                                        th:src="${product.imgPathProduct}" alt="Ảnh sản phẩm"
                                                        class="w-10 h-10 rounded-lg object-cover hidden sm:block" />
                                                    <div>
                                                        <p th:text="${product.nameProduct}">Tên sản phẩm</p>
                                                    </div>
                                                </div>
                                            </td>
                                            <td class="px-3 py-2"
                                                th:text="${product.priceProduct != null ? #numbers.formatDecimal(product.priceProduct, 0, 'POINT', 0, 'NONE') + ' ₫' : '—'}">
                                                0 đ
                                            </td>
                                            <td class="px-3 py-2">
                                                <span
                                                    class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 dark:bg-green-900/50 text-green-800 dark:text-green-300">
                                                    Còn hàng
                                                </span>
                                            </td>
                                            <td class="px-3 py-2 text-center">
                                                <div class="flex items-center justify-center gap-2">
                                                    <button
                                                        class="p-2 text-text-light-secondary dark:text-text-dark-secondary hover:text-primary transition-colors">
                                                        <span class="material-symbols-outlined text-base">edit</span>
                                                    </button>
                                                    <button
                                                        class="p-2 text-text-light-secondary dark:text-text-dark-secondary hover:text-red-500 transition-colors">
                                                        <span class="material-symbols-outlined text-base">delete</span>
                                                    </button>
                                                </div>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <div id="adminCategoryModalOverlay" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/40">
        <div class="bg-card-light dark:bg-card-dark rounded-xl shadow-xl w-full max-w-md p-6">
            <h3 id="adminCategoryModalTitle" class="text-base font-semibold mb-4">Danh mục</h3>
            <form id="adminCategoryForm" class="flex flex-col gap-4">
                <input type="hidden" id="adminCategoryId" />
                <div class="flex flex-col gap-1">
                    <label for="adminCategoryName" class="text-sm font-medium">Tên danh mục</label>
                    <input id="adminCategoryName" type="text"
                        class="border border-border-light dark:border-border-dark rounded-lg px-3 py-2 text-sm bg-background-light dark:bg-background-dark"
                        placeholder="Nhập tên danh mục" required />
                </div>
                <div class="flex flex-col gap-1">
                    <label for="adminCategoryImg" class="text-sm font-medium">Đường dẫn ảnh</label>
                    <input id="adminCategoryImg" type="text"
                        class="border border-border-light dark:border-border-dark rounded-lg px-3 py-2 text-sm bg-background-light dark:bg-background-dark"
                        placeholder="Nhập URL ảnh (tuỳ chọn)" />
                </div>
                <div id="adminCategoryError" class="text-sm text-red-500 hidden"></div>
                <div class="mt-4 flex justify-end gap-2">
                    <button type="button" id="adminCategoryCancelBtn"
                        class="px-4 py-2 text-sm font-medium rounded-lg border border-border-light dark:border-border-dark hover:bg-background-light dark:hover:bg-background-dark">
                        Hủy
                    </button>
                    <button type="submit" id="adminCategorySubmitBtn"
                        class="px-4 py-2 text-sm font-medium rounded-lg bg-primary text-white hover:bg-primary/90">
                        Lưu
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script th:inline="javascript">
        const adminCategoryModalOverlay = document.getElementById('adminCategoryModalOverlay');
        const adminCategoryForm = document.getElementById('adminCategoryForm');
        const adminCategoryId = document.getElementById('adminCategoryId');
        const adminCategoryName = document.getElementById('adminCategoryName');
        const adminCategoryImg = document.getElementById('adminCategoryImg');
        const adminCategoryTitle = document.getElementById('adminCategoryModalTitle');
        const adminCategoryError = document.getElementById('adminCategoryError');
        const adminCategoryCancelBtn = document.getElementById('adminCategoryCancelBtn');
        const adminCategorySubmitBtn = document.getElementById('adminCategorySubmitBtn');

        function openAdminCategoryModal(mode, id, name, img) {
            if (!adminCategoryModalOverlay) return;
            adminCategoryError.classList.add('hidden');
            adminCategoryError.textContent = '';
            if (mode === 'edit') {
                adminCategoryTitle.textContent = 'Sửa danh mục';
                adminCategoryId.value = id || '';
                adminCategoryName.value = name || '';
                adminCategoryImg.value = img || '';
            } else {
                adminCategoryTitle.textContent = 'Thêm danh mục mới';
                adminCategoryId.value = '';
                adminCategoryName.value = '';
                adminCategoryImg.value = '';
            }
            adminCategoryModalOverlay.classList.remove('hidden');
            adminCategoryModalOverlay.classList.add('flex');
            adminCategoryName.focus();
        }

        function closeAdminCategoryModal() {
            if (!adminCategoryModalOverlay) return;
            adminCategoryModalOverlay.classList.add('hidden');
            adminCategoryModalOverlay.classList.remove('flex');
        }

        function openEditCategoryModal(id) {
            const item = document.querySelector('[data-category-item="' + id + '"]');
            const nameEl = item ? item.querySelector('[data-category-name]') : null;
            const name = nameEl ? nameEl.textContent.trim() : '';
            const img = item ? item.getAttribute('data-category-img') : '';
            openAdminCategoryModal('edit', id, name, img);
        }

        function openCreateCategoryModal() {
            openAdminCategoryModal('create');
        }
        async function confirmDeleteCategory(id) {
            const doDelete = async function () {
                const form = document.createElement('form');
                form.method = 'POST';
                form.action = '/admin/categories/delete';
                const inputId = document.createElement('input');
                inputId.type = 'hidden';
                inputId.name = 'idCategory';
                inputId.value = id;
                form.appendChild(inputId);
                document.body.appendChild(form);
                form.submit();
            };

            const ok = await window.showConfirm('Bạn có chắc chắn muốn xóa danh mục này?');
            if (ok) {
                await doDelete();
            }
        }

        if (adminCategoryCancelBtn) {
            adminCategoryCancelBtn.addEventListener('click', function () {
                closeAdminCategoryModal();
            });
        }

        if (adminCategoryModalOverlay) {
            adminCategoryModalOverlay.addEventListener('click', function (e) {
                if (e.target === adminCategoryModalOverlay) closeAdminCategoryModal();
            });
        }

        if (adminCategoryForm) {
            adminCategoryForm.addEventListener('submit', async function (e) {
                e.preventDefault();
                adminCategoryError.classList.add('hidden');
                adminCategoryError.textContent = '';
                const id = adminCategoryId.value || null;
                const name = adminCategoryName.value.trim();
                const img = adminCategoryImg.value.trim();
                if (!name) {
                    adminCategoryError.textContent = 'Vui lòng nhập tên danh mục';
                    adminCategoryError.classList.remove('hidden');
                    return;
                }
                try {
                    const form = document.createElement('form');
                    form.method = 'POST';
                    form.action = id ? '/admin/categories/update' : '/admin/categories';

                    const nameInput = document.createElement('input');
                    nameInput.type = 'hidden';
                    nameInput.name = 'nameCategory';
                    nameInput.value = name;
                    form.appendChild(nameInput);

                    const imgInput = document.createElement('input');
                    imgInput.type = 'hidden';
                    imgInput.name = 'imgPathCategory';
                    imgInput.value = img;
                    form.appendChild(imgInput);

                    if (id) {
                        const idInput = document.createElement('input');
                        idInput.type = 'hidden';
                        idInput.name = 'idCategory';
                        idInput.value = id;
                        form.appendChild(idInput);
                    }

                    document.body.appendChild(form);
                    form.submit();
                } catch (err) {
                    console.error(err);
                    adminCategoryError.textContent = 'Lỗi kết nối máy chủ.';
                    adminCategoryError.classList.remove('hidden');
                }
            });
        }
    </script>
    <div th:insert="~{dialog-noti}"></div>
    <script src="/js/dialog-noti.js"></script>
</body>

</html>
