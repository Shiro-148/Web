<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"
        integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="/css/menu_listStyles.css">
    <link rel="stylesheet" href="/css/product_list.css">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <title>Document</title>
</head>

<body>
    <div class="header">
        <div th:insert="~{header :: header}"></div>
    </div>
    <div class="center" id="center">
        <div class="container">
            <div class="cate_menu_list">
                <div class="swiper swiper_cate_menu_list">
                    <div class="swiper-wrapper">
                        <div th:each="category : ${categories}" th:classappend=" ${category.idCategory} == ${selectedCategoryId} ? 'active' : '' " class="swiper-slide">
                            <a th:href="@{/product_list(categoryId=${category.idCategory})}">
                                <div class="card_menu_list">
                                    <span class="img">
                                        <img th:src="@{${category.imgPath}}" alt="" />
                                    </span>
                                    <span class="txt" th:text="${category.nameCategory}"></span>
                                </div>
                            </a>
                        </div>
                    </div>
                    <div class="swiper-pagination"></div>
                </div>
            </div>
            <div class="wrapper_cate_menu_card">
                <div th:each="product : ${products}" class="my_card card">
                    <a th:href="@{/product_detail/{id}(id=${product.idProduct})}">
                        <div class="card_img">
                            <img th:src="@{${product.imgPathProduct}}" alt="Product Image">
                        </div>
                    </a>
                    <div class="card_title_heart">
                        <div class="card_title" th:text="${product.nameProduct}"></div>
                        <div class="card_heart">
                            <i class="bx bx-heart"
                                th:attr="data-id=${product.idProduct}, data-favourite=${product.favouriteProduct}"
                                onclick="toggleFavourite(this)">
                            </i>
                        </div>
                    </div>
                    <div class="card_note">
                        <span th:utext="${#strings.replace(product.noteProduct, '\n', '<br>')}"></span>
                    </div>
                    <div class="card_bottom">
                        <div class="card_price_add">
                            <div class="card_price">
                                <span th:text="${product.priceProduct} + '₫'"></span>
                            </div>
                            <div class="card_add">
                                <div class="button_card_add">
                                    <i class='bx bx-plus icon_size' style='color:#ffffff'></i>
                                </div>
                            </div>
                        </div>
                        <div class="card_discount">
                            <div class="price_old" th:if="${product.priceOldProduct != null}">
                                <i class='bx bxs-discount' style='color:#ef0b49'></i>
                                <span th:text="${product.priceOldProduct} + '₫'"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="footer">
        <div th:insert="~{footer :: footer}"></div>
    </div>
    <div role="dialog" aria-modal="true" class="fade modal-delivery-address modal" id="location" tabindex="-1"
        style="overflow-y: scroll;">
        <div class="modal-dialog modal-dialog-centered modal-xl">
            <div class="modal-content">
                <div class="modal-body">
                    <div class="address_form">
                        <form>
                            <p>Vui lòng nhập địa chỉ của bạn (địa chỉ này sẽ được dùng làm địa chỉ giao hàng).
                                Hệ thống sẽ tìm cửa hàng gần nơi bạn sinh sống.</p>
                            <div class="home_address">
                                <label for="address">Địa chỉ</label>
                                <input type="text" placeholder="Vui lòng nhập" id="address">
                            </div>
                            <div class="detail_address">
                                <div class="name_address">
                                    <label for="name_address">Tên địa chỉ</label>
                                    <br>
                                    <input type="text" placeholder="Gym / Nhà riêng / cơ quan" id="name_address">
                                </div>
                                <div class="note">
                                    <label for="note">Ghi chú</label>
                                    <br>
                                    <input type="text" placeholder="Vui lòng nhập" id="note">
                                </div>
                                <div class="btn_toggle">
                                    <input type="checkbox" id="check">
                                    <label for="check" class="button"></label>
                                    <span>Đặt làm địa chỉ mặc định</span>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn custom_btn_cancel" title="Hủy bỏ" data-bs-dismiss="modal">Hủy
                        bỏ</button>
                    <button type="button" class="btn custom_btn_submit" title="Thêm mới" disabled>Thêm mới</button>
                </div>
            </div>
        </div>
    </div>
    <script src="/js/scripts.js"></script>
    <script src="/js/product.js"></script>
</body>
