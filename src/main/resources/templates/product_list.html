<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="/css/menu_listStyles.css">
    <link rel="stylesheet" href="/css/product_list.css">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <title>Document</title>
</head>

<body>
    <div class="header">
        <div th:insert="~{header :: header}"></div>
    </div>
    <div class="center" id="center">
        <div class="container">
            <div class="cate_menu_list">
                <div class="swiper swiper_cate_menu_list">
                    <div class="swiper-wrapper">
                        <div th:each="category : ${categories}" th:classappend=" ${category.idCategory} == ${selectedCategoryId} ? 'active' : '' " class="swiper-slide">
                            <a th:href="@{/product_list(categoryId=${category.idCategory})}">
                                <div class="card_menu_list">
                                    <span class="img">
                                        <img th:src="@{${category.imgPath}}" alt="" />
                                    </span>
                                    <span class="txt" th:text="${category.nameCategory}"></span>
                                </div>
                            </a>
                        </div>
                    </div>
                    <div class="swiper-pagination"></div>
                </div>
            </div>
            <div class="wrapper_cate_menu_card">
                <div th:each="product : ${products}" class="my_card card">
                    <a th:href="@{/product_detail/{id}(id=${product.idProduct})}">
                        <div class="card_img">
                            <img th:src="@{${product.imgPathProduct}}" alt="Product Image">
                        </div>
                    </a>
                    <div class="card_title_heart">
                        <div class="card_title" th:text="${product.nameProduct}"></div>
                        <div class="card_heart">
                            <i class="bx"
                               th:classappend="${favoriteIds.contains(product.idProduct)} ? ' bxs-heart' : ' bx-heart'"
                               th:attr="data-id=${product.idProduct}, data-favourite=${favoriteIds.contains(product.idProduct)}"
                               onclick="toggleFavourite(this)">
                            </i>
                        </div>
                    </div>
                    <div class="card_note">
                        <span th:utext="${#strings.replace(product.noteProduct, '\n', '<br>')}"></span>
                    </div>
                    <div class="card_bottom">
                        <div class="card_price_add">
                            <div class="card_price">
                                <span
                                    th:text="${#numbers.formatDecimal(product.priceProduct, 0, 'POINT', 0, 'NONE')} + ' ₫'"></span>
                            </div>
                            <div class="card_add">
                                <div class="button_card_add" th:attr="data-id=${product.idProduct}">
                                    <i class='bx bx-plus icon_size' style='color:#ffffff'></i>
                                </div>
                            </div>
                        </div>
                        <div class="card_discount">
                            <div class="price_old" th:if="${product.priceOldProduct != null}">
                                <i class='bx bxs-discount' style='color:#ef0b49'></i>
                                <span
                                    th:text="${#numbers.formatDecimal(product.priceOldProduct, 0, 'POINT', 0, 'NONE')} + ' ₫'"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="footer">
        <div th:insert="~{footer :: footer}"></div>
    </div>
    <div th:insert="~{location}"></div>
    <div th:insert="~{login}"></div>
    <div th:insert="~{register}"></div>
    <script src="/js/scripts.js"></script>
    <script src="/js/product.js"></script>
</body>
